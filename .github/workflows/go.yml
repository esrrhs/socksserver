name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ "stable" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v -trimpath -ldflags="-s -w" ./...

      - name: Test
        run: go test -v -race ./...
